name: fixora
description: Fixora - AI powered repair assistant with camera diagnosis, safety checks, voice help and ESP32 verification.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  camera: ^0.11.0+2
  http: ^1.2.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
